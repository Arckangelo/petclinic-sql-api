services:
  db:
    image: postgres:16.3
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic"]
      interval: 5s
      retries: 10
  api:
    image: springcommunity/spring-petclinic-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petclinic
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    ports:
      - "9966:9966"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9966/petclinic/v3/api-docs > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

