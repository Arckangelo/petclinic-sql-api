services:
  db:
    image: postgres:16.3
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic"]
      interval: 5s
      retries: 10
  api:
    image: springcommunity/spring-petclinic-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petclinic
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
    ports:
      - "9966:9966"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9966/petclinic/v3/api-docs > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  # Apaga as cópias de índice que a API cria a cada início (BUG-02).
  # Fica rodando em laço: a cada 10 s procura cópias e apaga, então limpa sozinho depois de
  # `docker compose up`, `docker compose restart` ou `docker compose restart api`.
  # Para reproduzir o bug sem a limpeza, pare este serviço antes: `docker compose stop db-index-cleanup`.
  # O healthcheck só fica saudável depois da primeira limpeza sem erro.
  db-index-cleanup:
    image: postgres:16.3
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: petclinic
      PGPASSWORD: petclinic
      PGDATABASE: petclinic
    volumes:
      - ./sql/maintenance/drop_duplicate_indexes.sql:/cleanup/drop_duplicate_indexes.sql:ro
    command:
      - sh
      - -c
      - |
        trap 'exit 0' TERM INT
        rm -f /tmp/cleanup-done
        while true; do
          out=$$(psql -q -v ON_ERROR_STOP=1 -f /cleanup/drop_duplicate_indexes.sql 2>&1) && touch /tmp/cleanup-done
          echo "$$out" | grep -v -e 'Limpeza concluída: 0 ' -e '^DO$$' -e '^$$' || true
          sleep 10 & wait $$!
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cleanup-done"]
      interval: 2s
      retries: 30
    restart: "no"
